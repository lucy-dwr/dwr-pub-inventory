llm:
  base_url: https://cog-dwr-science-ai-prod-9m4k2q.services.ai.azure.com/anthropic/v1
  provider: anthropic
  model: claude-sonnet-5
  rate_limit:
    # This is the effective per-user/model output-token limit for the current
    # Azure Foundry endpoint. Keep a safety margin for other interactive use.
    output_tokens_per_minute: 2000
    safety_fraction: 0.8
    state_path: data/generated/llm_rate_limit.csv
    classification_batch_size: 2
    classification_max_output_tokens: 600
    geo_batch_size: 20
    geo_max_output_tokens: 600
    affiliation_batch_size: 10
    affiliation_max_output_tokens: 600
    max_attempts: 3
    retry_wait_seconds: 65

scopus:
  # Toggle this to enable/disable Scopus calls
  allow_api_calls: false
  doc_types:
    - article
    - review
  auto_fetch: true
  max_results: .inf
  searches:
    funder:
      query: California Department of Water Resources
      field: funder
    affiliation:
      query: California Department of Water Resources
      field: affiliation

refresh:
  # Change the ID to the date you want to refresh up to
  # This date will also be recorded as metadata in the refresh log
  id: 2026-08-25
  default_mode: new_records_only

paths:
  taxonomy: taxonomy/dwr_disciplines_taxonomy.csv
  classify_system_prompt: prompts/classify_system_prompt.txt
  classify_user_instructions: prompts/classify_user_instructions.txt
  affiliation_system_prompt: prompts/affiliation_system_prompt.txt
  affiliation_user_template: prompts/affiliation_user_template.txt
  geo_system_prompt: prompts/geo_system_prompt.txt
  geo_user_template: prompts/geo_user_template.txt
  institution_geo_lookup: data/lookups/institution_geo_lookup.csv
  funding_review_decisions: data/decisions/funding_review_decisions.csv
  funder_review_queue: data/queues/funder_review_queue.parquet
  accepted_publications: data/generated/accepted_publications.parquet
  harvests_dir: data/harvests
  institution_reference: data/lookups/institution_reference.txt
  affiliation_lookup: data/lookups/affiliation_lookup.csv
  dashboard_csv: data/generated/dwr_publications.csv
  dashboard_parquet: data/generated/dwr_publications.parquet
  refresh_log: data/refresh_log.csv
  funding_division_lookup: data/lookups/funding_division_lookup.csv
  author_review_decisions: data/decisions/author_review_decisions.csv
  author_division_decisions: data/decisions/author_division_decisions.csv
  author_review_queue: data/queues/author_review_queue.parquet
  author_division_lookup: data/lookups/author_division_lookup.csv
  dwr_org_lookup: data/lookups/dwr_org_lookup.csv
