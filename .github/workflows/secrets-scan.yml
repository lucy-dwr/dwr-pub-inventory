name: Secrets scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install betterleaks
        run: |
          curl -sSfL \
            "https://github.com/betterleaks/betterleaks/releases/download/v1.5.0/betterleaks_1.5.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin betterleaks

      - name: Scan for secrets
        run: |
          betterleaks git . \
            --baseline-path betterleaks-baseline.json \
            --log-level warn
